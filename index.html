<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainbow Dino Run — colourful dino game</title>
<style>
  :root {
    --ink: #1b1145;
    --pink: #ff4d8d;
    --violet: #7c4dff;
    --cyan: #22d3ee;
    --lime: #b8ff3c;
    --amber: #ffb300;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 12px 28px;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 700px at 12% -10%, #ff4d8d55, transparent 60%),
      radial-gradient(1000px 700px at 95% 0%, #22d3ee55, transparent 60%),
      radial-gradient(900px 700px at 50% 115%, #b8ff3c44, transparent 60%),
      linear-gradient(160deg, #2a0f5e, #12063a 55%, #24085a);
  }
  .wrap { width: min(100%, 1020px); }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(20px, 4.2vw, 32px);
    letter-spacing: 1px;
    line-height: 1.05;
    background: linear-gradient(92deg, var(--lime), var(--cyan), var(--pink), var(--amber));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.35));
  }
  .sub { margin: 4px 0 0; font-size: 13px; color: #cfc6ff; opacity: .9 }
  .tools { display: flex; gap: 8px }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: #23124f;
    border: 0;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #e6ddff);
    box-shadow: 0 4px 0 #6d4bc0, 0 8px 18px rgba(0,0,0,.35);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #6d4bc0; }
  button.alt { color: #fff; background: linear-gradient(180deg, #ff7fb0, #ff2e7e); box-shadow: 0 4px 0 #a3155a, 0 8px 18px rgba(0,0,0,.35); }
  .stage {
    position: relative;
    border-radius: 22px;
    padding: 10px;
    background: linear-gradient(180deg, #6a3df0, #3a1d9e);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 0 2px #ffffff33;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    background: #7ee8fa;
    touch-action: none;
    box-shadow: inset 0 0 0 2px #0003;
  }
  .legend {
    display: flex;
    gap: 8px 14px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 14px;
    font-size: 13px;
    color: #e5ddff;
  }
  kbd {
    display: inline-block;
    padding: 3px 8px;
    margin-right: 4px;
    border-radius: 7px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    color: #24114f;
    background: #fff;
    box-shadow: 0 3px 0 #8a72c9;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>RAINBOW DINO RUN</h1>
      <p class="sub">Chrome's offline runner, repainted in full colour.</p>
    </div>
    <div class="tools">
      <button id="mute" class="alt">Sound: ON</button>
      <button id="restart">Restart</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="960" height="300"></canvas>
  </div>

  <div class="legend">
    <span><kbd>Space</kbd><kbd>W</kbd><kbd>&uarr;</kbd> jump (hold = higher)</span>
    <span><kbd>S</kbd><kbd>&darr;</kbd> duck / fast-fall</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>R</kbd> restart</span>
    <span style="opacity:.75">Every 250 points the whole palette shifts hue</span>
    <span style="opacity:.75">On touch: tap top = jump, hold bottom = duck</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const cvs = document.getElementById("game");
  const ctx = cvs.getContext("2d");
  const W = 960, H = 300, GROUND = 240;
  const STEP = 1 / 60;

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
  }
  fit();
  window.addEventListener("resize", fit);

  let THEME = 0;
  const C = (h, s, l, a = 1) => `hsla(${(h + THEME) % 360},${s}%,${l}%,${a})`;

  const PAL = {
    ink: () => C(258, 70, 16),
    dino: () => C(28, 92, 55),
    dinoHi: () => C(40, 95, 74),
    dinoDark: () => C(18, 85, 30),
    spike: () => C(190, 90, 56),
    spike2: () => C(322, 90, 62),
    cactus: () => C(148, 80, 44),
    cactusHi: () => C(140, 88, 62),
    cactusDark: () => C(156, 72, 26),
    flower: () => C(52, 100, 60),
    bird: () => C(322, 88, 60),
    birdDark: () => C(340, 78, 42),
    wing: () => C(200, 92, 60),
    beak: () => C(48, 100, 60),
    cloud: () => C(0, 0, 100),
    cloudShade: () => C(240, 70, 86)
  };

  const rr = (x, y, w, h, r) => {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  const tri = (p1, p2, p3) => {
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.lineTo(p3[0], p3[1]);
    ctx.closePath();
  };
  const fillStroke = (fill, stroke, w = 3) => {
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.lineWidth = w;
      ctx.strokeStyle = stroke;
      ctx.stroke();
    }
  };

  let muted = false, actx = null;
  function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start();
      o.stop(actx.currentTime + dur + 0.02);
    } catch (e) {}
  }

  const BEST = (() => {
    try { return parseInt(localStorage.getItem("rdr_best") || "0", 10) || 0; }
    catch (e) { return 0; }
  })();
  function saveBest(v) {
    try { localStorage.setItem("rdr_best", String(v)); } catch (e) {}
  }

  const D = { x: 96, y: GROUND - 50, w: 46, h: 50, v: 0, onGround: true, duck: false, run: 0, blink: 0 };
  const G = {
    over: false, paused: false, started: false, t: 0, dist: 0, speed: 6,
    score: 0, hi: BEST, milestone: 0, flash: 0, shake: 0, cleared: 0, lastMilestone: 0
  };
  let obstacles = [];
  let parts = [];
  let pops = [];

  const GRAV = 0.62;
  const JUMP_V = -11.6;
  const DROP_V = -7.4;
  const SPEED_UP = 0.0011;
  const MAX_SPEED = 13.4;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  function reset() {
    D.x = 96; D.v = 0; D.duck = false; D.onGround = true;
    D.w = 46; D.h = 50; D.y = GROUND - 50; D.run = 0;
    G.over = false; G.paused = false; G.started = true; G.dist = 0; G.speed = 6;
    G.score = 0; G.milestone = 0; G.flash = 0; G.shake = 0; G.cleared = 0;
    G.lastMilestone = 0; THEME = 0;
    obstacles = []; parts = []; pops = [];
    touchDuck = false;
    held.clear();
  }

  function dust(x, y, n, spread, col) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: x + rand(-6, 6), y: y + rand(-3, 2),
        vx: rand(-spread, spread * 0.3), vy: rand(-2.6, -0.2),
        r: rand(2.2, 6), life: rand(0.28, 0.6), max: 0.6, col
      });
    }
  }
  function pop(x, y, text, hue) {
    pops.push({ x, y, text, hue, life: 1, max: 1 });
  }

  function spawn() {
    if (G.cleared >= 4 && Math.random() < 0.3 && G.dist > 260) {
      const band = pick(["low", "mid", "high"]);
      const y = band === "low" ? GROUND - 32 : band === "mid" ? GROUND - 64 : GROUND - 102;
      obstacles.push({ type: "bird", x: W + 60, y, w: 44, h: 26, band, flap: rand(0, 6.28) });
    } else {
      const kind = pick(["sm", "lg", "sm", "tri", "lg", "dt"]);
      let w, h;
      if (kind === "sm") { w = 24; h = 30; }
      else if (kind === "lg") { w = 30; h = 38; }
      else if (kind === "tri") { w = 44; h = 40; }
      else if (kind === "dt") { w = 50; h = 44; }
      else { w = 28; h = 36; }
      obstacles.push({ type: "cactus", kind, x: W + 60, y: GROUND - h, w, h, flower: Math.random() < 0.72 });
    }
  }

  function jump() {
    if (G.over || G.paused) return;
    G.started = true;
    if (D.onGround) {
      D.v = JUMP_V;
      D.onGround = false;
      D.duck = false;
      D.w = 46; D.h = 50;
      dust(D.x + 14, GROUND - 2, 7, 3.4, PAL.dinoHi());
      beep(520, 0.09, "square", 0.045, 320);
    }
  }
  function releaseJump() {
    if (!D.onGround && D.v < DROP_V) D.v = DROP_V;
  }
  function setDuck(on) {
    if (G.over || G.paused) return;
    if (on) {
      D.duck = true;
      if (D.onGround) { D.w = 56; D.h = 26; D.y = GROUND - 26; }
    } else {
      D.duck = false;
      if (D.onGround) { D.w = 46; D.h = 50; D.y = GROUND - 50; }
    }
  }

  const held = new Set();
  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    if (held.has(k)) return;
    held.add(k);
    if (k === " " || k === "arrowup" || k === "w") jump();
    else if (k === "arrowdown" || k === "s") setDuck(true);
    else if (k === "p") { if (!G.over) { G.paused = !G.paused; beep(G.paused ? 300 : 640, 0.08, "triangle", 0.05); } }
    else if (k === "r") { reset(); beep(700, 0.08, "triangle", 0.05); }
    else if (k === "enter" && G.over) reset();
  });
  window.addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    held.delete(k);
    if (k === " " || k === "arrowup" || k === "w") releaseJump();
    else if (k === "arrowdown" || k === "s") setDuck(false);
  });

  let touchDuck = false;
  cvs.addEventListener("pointerdown", e => {
    cvs.setPointerCapture(e.pointerId);
    const b = cvs.getBoundingClientRect();
    const y = ((e.clientY - b.top) / b.height) * H;
    if (y > H - 110) { touchDuck = true; setDuck(true); } else jump();
  });
  const lift = () => { if (touchDuck) { touchDuck = false; setDuck(false); } else releaseJump(); };
  cvs.addEventListener("pointerup", lift);
  cvs.addEventListener("pointercancel", lift);
  cvs.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("blur", () => {
    held.clear();
    touchDuck = false;
    setDuck(false);
  });

  document.getElementById("restart").addEventListener("click", () => { reset(); beep(700, 0.08, "triangle", 0.05); });
  const muteBtn = document.getElementById("mute");
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "Sound: OFF" : "Sound: ON";
    muteBtn.classList.toggle("alt", !muted);
    if (!muted) beep(760, 0.08, "triangle", 0.05);
  });

  function crash(o) {
    G.over = true;
    G.shake = 14;
    G.flash = 1;
    if (G.score > G.hi) { G.hi = G.score; saveBest(G.hi); pop(D.x + 10, D.y - 18, "NEW BEST!", 48); }
    pop(D.x + 6, D.y - 30, "OUCH!", 350);
    dust(D.x + 22, D.y + D.h - 8, 18, 5.5, PAL.spike());
    dust(o.x + o.w / 2, o.y + o.h / 2, 12, 4.5, PAL.cactusHi());
    beep(200, 0.35, "sawtooth", 0.05, -140);
  }

  function dinoBox() {
    if (D.duck && D.onGround) return { x: D.x + 5, y: D.y + 2, w: 48, h: 22 };
    return { x: D.x + 5, y: D.y + 5, w: 36, h: 44 };
  }
  function boxHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    G.t += STEP;
    if (G.flash > 0) G.flash = Math.max(0, G.flash - STEP * 1.6);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - STEP * 40);
    D.blink = (D.blink + STEP) % 4.4;

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= STEP;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i];
      p.y -= 0.55; p.life -= STEP * 0.85;
      if (p.life <= 0) pops.splice(i, 1);
    }

    if (G.over) {
      G.speed = Math.max(2.2, G.speed - STEP * 26);
      return;
    }
    if (G.paused) return;
    if (!G.started) {
      D.run += STEP * 1.6;
      D.w = 46; D.h = 50; D.y = GROUND - 50; D.duck = false;
      return;
    }

    G.speed = Math.min(MAX_SPEED, G.speed + SPEED_UP);
    G.dist += G.speed;
    G.score = Math.floor(G.dist * 0.025);
    D.run += G.speed * 0.026;

    const ms = Math.floor(G.score / 250);
    if (ms > G.lastMilestone) {
      G.lastMilestone = ms;
      THEME = (THEME + 47) % 360;
      pop(200, 130, ["NICE!", "WOW!", "SUPER!", "UNREAL!", "LEGEND!"][ms % 5], (250 + ms * 40) % 360);
      beep(660 + ms * 40, 0.16, "triangle", 0.05, 240);
    }

    if (!D.onGround) {
      D.v += GRAV * (1 + (D.duck || touchDuck ? 1.4 : 0));
      D.y += D.v;
      if (D.y + D.h >= GROUND) {
        D.y = GROUND - D.h;
        D.onGround = true;
        D.v = 0;
        dust(D.x + 16, GROUND - 2, 9, 3.8, PAL.dinoHi());
      }
    } else if (D.duck) {
      if (Math.random() < 0.25) dust(D.x + 54, GROUND - 2, 1, 2.2, PAL.cloudShade());
    } else if (Math.random() < 0.28 * (G.speed / MAX_SPEED + 0.4)) {
      dust(D.x + 8, GROUND - 2, 1, 1.9, PAL.cloudShade());
    }

    const last = obstacles.length ? obstacles[obstacles.length - 1] : null;
    const gap = rand(190, 260) + G.speed * rand(30, 44);
    if (!last || last.x < W - gap) spawn();

    const db = dinoBox();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= G.speed;
      if (o.type === "bird") { o.flap += STEP * 12; o.x -= G.speed * 0.15; }
      if (o.x + o.w < -40) {
        obstacles.splice(i, 1);
        G.cleared++;
        continue;
      }
      const ob = o.type === "bird"
        ? { x: o.x + 3, y: o.y + 3, w: o.w - 6, h: o.h - 6 }
        : { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 6 };
      if (boxHit(db, ob)) { crash(o); return; }
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, C(205, 92, 66));
    g.addColorStop(0.42, C(268, 88, 76));
    g.addColorStop(0.78, C(330, 92, 74));
    g.addColorStop(1, C(20, 96, 74));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);

    const sx = W - 132, sy = 78 + Math.sin(G.t * 0.6) * 4;
    const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 92);
    glow.addColorStop(0, C(48, 100, 78, 0.95));
    glow.addColorStop(0.28, C(38, 100, 66, 0.5));
    glow.addColorStop(1, C(38, 100, 60, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(sx, sy, 92, 0, 6.2832); ctx.fill();
    ctx.fillStyle = C(46, 100, 78);
    ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 6.2832); ctx.fill();
    ctx.fillStyle = C(52, 100, 90, 0.75);
    ctx.beginPath(); ctx.arc(sx - 10, sy - 9, 6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 9, sy + 5, 4, 0, 6.2832); ctx.fill();

    ctx.strokeStyle = C(300, 60, 100, 0.22);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 44 + Math.sin(G.t * 0.35) * 3);
    ctx.lineTo(W, 34 + Math.sin(G.t * 0.35 + 1.2) * 4);
    ctx.stroke();
  }

  function drawClouds() {
    const P = 340, off = (G.dist * 0.14) % P;
    const seeds = [
      { x: 30, y: 34, s: 1.05 },
      { x: 150, y: 66, s: 0.72 },
      { x: 258, y: 22, s: 0.86 }
    ];
    for (const s of seeds) {
      const x = ((s.x - off) % P + P) % P - 20;
      const y = s.y;
      const k = s.s;
      ctx.fillStyle = PAL.cloudShade();
      ctx.beginPath();
      ctx.ellipse(x + 2, y + 3, 34 * k, 15 * k, 0, 0, 6.2832);
      ctx.ellipse(x - 16 * k, y + 6, 20 * k, 11 * k, 0, 0, 6.2832);
      ctx.ellipse(x + 20 * k, y + 7, 18 * k, 10 * k, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = PAL.cloud();
      ctx.beginPath();
      ctx.ellipse(x, y, 34 * k, 14 * k, 0, 0, 6.2832);
      ctx.ellipse(x - 16 * k, y + 3, 19 * k, 10 * k, 0, 0, 6.2832);
      ctx.ellipse(x + 20 * k, y + 4, 17 * k, 9 * k, 0, 0, 6.2832);
      ctx.fill();
    }
  }

  function drawHills() {
    const wave = (period, drift, base, amp, pow, step = 7) => {
      const o = (G.dist * drift) % period;
      ctx.beginPath();
      ctx.moveTo(-70, GROUND);
      for (let x = -70; x <= W + 70; x += step) {
        const u = 0.5 - 0.5 * Math.cos(((x + o) / period) * 6.2832);
        ctx.lineTo(x, GROUND - base - amp * Math.pow(u, pow));
      }
      ctx.lineTo(W + 70, GROUND);
      ctx.closePath();
      ctx.fill();
    };
    ctx.fillStyle = C(292, 62, 56, 0.9);
    wave(300, 0.05, 24, 96, 0.75);
    ctx.fillStyle = C(262, 66, 60, 0.94);
    wave(230, 0.11, 20, 66, 0.9);
    ctx.fillStyle = C(216, 62, 56);
    wave(180, 0.22, 12, 50, 1);
    ctx.fillStyle = C(206, 72, 66);
    ctx.fillRect(0, GROUND - 6, W, 6);
  }

  function drawGround() {
    ctx.fillStyle = C(250, 55, 22);
    ctx.fillRect(0, GROUND, W, H - GROUND);
    const cell = 26, off = (G.dist * 1) % cell;
    for (let x = -cell; x < W + cell; x += cell) {
      const i = Math.round((x + off) / cell);
      ctx.fillStyle = i % 2 === 0 ? C(252, 60, 30) : C(252, 60, 37);
      ctx.fillRect(x - off, GROUND, cell / 2, H - GROUND);
    }
    ctx.fillStyle = C(268, 80, 46);
    ctx.fillRect(0, GROUND - 3, W, 7);
    ctx.fillStyle = C(56, 100, 70);
    ctx.fillRect(0, GROUND - 3, W, 3);

    const d = 20, o = (G.dist * 1.4) % (d * 2);
    for (let x = -d * 2; x < W + d * 2; x += d * 2) {
      ctx.fillStyle = C(320, 90, 62, 0.55);
      ctx.fillRect(x - o, GROUND + 9, d, 4);
    }
  }

  function drawCactus(o) {
    const x = o.x, y = o.y, h = o.h, w = o.w;
    const one = (sx, top, sw, sh) => {
      rr(sx, top, sw, sh, Math.min(sw / 2, 9));
      fillStroke(PAL.cactus(), PAL.cactusDark(), 3);
      rr(sx + 3, top + 7, sw * 0.32, Math.max(2, sh - 16), 4);
      ctx.fillStyle = PAL.cactusHi();
      ctx.fill();
    };
    ctx.save();
    if (o.kind === "sm" || o.kind === "lg") {
      one(x + w * 0.24, y, w * 0.5, h);
      one(x + 2, y + h * 0.36, w * 0.24, h * 0.64);
      one(x + w - w * 0.26 - 2, y + h * 0.44, w * 0.24, h * 0.56);
    } else if (o.kind === "tri") {
      one(x + w * 0.04, y + h * 0.26, w * 0.26, h * 0.74);
      one(x + w * 0.32, y, w * 0.3, h);
      one(x + w * 0.68, y + h * 0.32, w * 0.24, h * 0.68);
    } else if (o.kind === "dt") {
      one(x + w * 0.04, y + h * 0.14, w * 0.28, h * 0.86);
      one(x + w * 0.36, y, w * 0.3, h);
      one(x + w * 0.7, y + h * 0.2, w * 0.24, h * 0.8);
      one(x + w * 0.16, y + h * 0.36, w * 0.16, h * 0.26);
      one(x + w * 0.46, y + h * 0.22, w * 0.16, h * 0.3);
    } else {
      one(x + w * 0.06, y + h * 0.22, w * 0.32, h * 0.78);
      one(x + w * 0.4, y, w * 0.34, h);
      one(x + w * 0.74, y + h * 0.4, w * 0.22, h * 0.6);
    }
    if (o.flower) {
      const fr = 2.6 + h * 0.045;
      const fx = x + o.w * 0.5, fy = y - 2;
      ctx.fillStyle = PAL.flower();
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * 6.2832 + 0.3;
        ctx.beginPath();
        ctx.arc(fx + Math.cos(a) * (fr + 1.1), fy + Math.sin(a) * (fr + 1.1), fr, 0, 6.2832);
        ctx.fill();
      }
      ctx.fillStyle = C(48, 100, 62);
      ctx.beginPath(); ctx.arc(fx, fy, fr * 0.8, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawBird(o) {
    const up = Math.sin(o.flap) > 0;
    const x = o.x, y = o.y;
    ctx.save();
    ctx.translate(x, y + 4);
    ctx.scale(0.72, 0.72);
    ctx.fillStyle = PAL.wing();
    ctx.beginPath();
    if (up) {
      ctx.moveTo(12, 16);
      ctx.quadraticCurveTo(24, -6, 40, -2);
      ctx.quadraticCurveTo(28, 8, 16, 20);
    } else {
      ctx.moveTo(12, 10);
      ctx.quadraticCurveTo(26, 24, 42, 18);
      ctx.quadraticCurveTo(28, 8, 14, 18);
    }
    ctx.closePath();
    fillStroke(PAL.wing(), PAL.birdDark(), 2.5);

    ctx.fillStyle = PAL.birdDark();
    tri([-2, 20], [6, 14], [4, 24]);
    ctx.fill();

    ctx.fillStyle = PAL.bird();
    ctx.beginPath();
    ctx.ellipse(20, 18, 22, 12, 0, 0, 6.2832);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = PAL.birdDark();
    ctx.stroke();

    ctx.fillStyle = PAL.birdDark();
    ctx.beginPath();
    ctx.ellipse(38, 13, 9, 8, 0, 0, 6.2832);
    ctx.fill();

    ctx.fillStyle = PAL.beak();
    tri([45, 10], [60, 14], [45, 18]);
    ctx.fill();
    ctx.strokeStyle = PAL.birdDark();
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(40, 10, 3.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = PAL.ink();
    ctx.beginPath(); ctx.arc(41, 10, 1.7, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function drawLeg(angle, foot) {
    ctx.save();
    ctx.translate(15, -4);
    ctx.rotate(angle);
    rr(-5, -22, 10, 24, 5);
    fillStroke(PAL.dino(), PAL.dinoDark(), 2.5);
    ctx.fillStyle = foot;
    rr(-4, -4, 16, 7, 3.5);
    ctx.fill();
    ctx.restore();
  }

  function drawEye(x, y) {
    if (G.over) {
      ctx.strokeStyle = PAL.ink();
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4);
      ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4);
      ctx.stroke();
      return;
    }
    if (D.blink < 0.12) {
      ctx.strokeStyle = PAL.ink();
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, 4.6, 0, 6.2832); ctx.fill();
    ctx.fillStyle = PAL.ink();
    ctx.beginPath(); ctx.arc(x + 1.2, y + 0.4, 2.4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x + 2, y - 0.8, 0.9, 0, 6.2832); ctx.fill();
  }

  function drawDino() {
    ctx.save();
    ctx.translate(D.x, D.y + D.h);
    const duck = D.duck && D.onGround;
    const sway = Math.sin(D.run * 2) * 1.6;

    if (duck) {
      ctx.fillStyle = PAL.dinoDark();
      ctx.beginPath();
      ctx.moveTo(14, -22);
      ctx.quadraticCurveTo(-6, -26, -12, -14);
      ctx.quadraticCurveTo(-2, -12, 14, -10);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.translate(17, -9);
      ctx.rotate(Math.sin(D.run * 2) * 0.55);
      rr(-4, -7, 9, 8, 4);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.2);
      ctx.fillStyle = PAL.dinoDark();
      rr(-2, -2, 15, 6, 3);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = PAL.spike();
      tri([6, -25], [6, -19], [1, -22]); ctx.fill();
      tri([12, -26], [12, -20], [7, -23]); ctx.fill();

      ctx.fillStyle = PAL.dino();
      ctx.beginPath();
      ctx.ellipse(24, -15, 20, 11, 0, 0, 6.2832);
      ctx.fill();
      ctx.lineWidth = 2.4; ctx.strokeStyle = PAL.dinoDark(); ctx.stroke();
      ctx.fillStyle = PAL.dinoHi();
      ctx.beginPath(); ctx.ellipse(26, -12, 13, 6, 0, 0, 6.2832); ctx.fill();

      rr(34, -26, 20, 15, 8);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.6);
      ctx.fillStyle = PAL.dinoHi();
      rr(39, -14, 11, 4, 2);
      ctx.fill();
      rr(46, -19, 9, 8, 4);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.6);
      ctx.fillStyle = PAL.ink();
      rr(48, -13, 7, 2.4, 1.2);
      ctx.fill();
      drawEye(43, -21);
    } else {
      ctx.translate(0, sway * 0.25);

      ctx.fillStyle = PAL.dinoDark();
      ctx.beginPath();
      ctx.moveTo(12, -32);
      ctx.quadraticCurveTo(-8, -36, -18, -22);
      ctx.quadraticCurveTo(-2, -22, 14, -16);
      ctx.closePath();
      ctx.fill();

      const p = D.run * 2;
      drawLeg(Math.sin(p) * 0.62, PAL.dinoDark());
      drawLeg(Math.sin(p + 3.1416) * 0.62, PAL.dinoDark());

      ctx.fillStyle = PAL.spike();
      tri([2, -34], [2, -25], [-4, -30]); ctx.fill();
      tri([10, -37], [10, -28], [4, -33]); ctx.fill();
      ctx.fillStyle = PAL.spike2();
      tri([17, -38], [17, -29], [11, -34]); ctx.fill();

      ctx.fillStyle = PAL.dino();
      ctx.beginPath();
      ctx.ellipse(22, -25, 19, 16, -0.12, 0, 6.2832);
      ctx.fill();
      ctx.lineWidth = 2.8; ctx.strokeStyle = PAL.dinoDark(); ctx.stroke();
      ctx.fillStyle = PAL.dinoHi();
      ctx.beginPath();
      ctx.ellipse(24, -20, 12, 9, -0.12, 0, 6.2832);
      ctx.fill();

      ctx.save();
      ctx.translate(30, -30);
      ctx.rotate(-0.35 + Math.sin(p) * 0.25);
      rr(0, -3, 13, 6, 3);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.4);
      ctx.fillStyle = PAL.spike();
      rr(10, -1.5, 5, 4, 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(22, -43);
      ctx.rotate(sway * 0.012);
      rr(0, 0, 22, 19, 9);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.8);
      ctx.fillStyle = PAL.dinoHi();
      rr(7, 12, 11, 4, 2);
      ctx.fill();
      rr(15, 8, 9, 10, 4.5);
      fillStroke(PAL.dino(), PAL.dinoDark(), 2.8);
      ctx.fillStyle = PAL.ink();
      rr(17, 13, 6, 2.4, 1.2);
      ctx.fill();
      drawEye(11, 6);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + p.life / p.max * 0.8), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, hue, sat, light, align = "left", weight = 700, outline = true) {
    ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = "alphabetic";
    if (outline) {
      ctx.lineWidth = Math.max(3, size * 0.18);
      ctx.strokeStyle = C(262, 70, 18, 0.9);
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = `hsla(${(hue + THEME) % 360},${sat}%,${light}%)`;
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    const s = String(G.score).padStart(5, "0");
    ctx.font = `800 42px "Trebuchet MS", "Segoe UI", system-ui, sans-serif`;
    const w = ctx.measureText(s).width;
    ctx.fillStyle = C(262, 70, 16, 0.32);
    rr(W - 20 - w - 18, 14, w + 36, 46, 16);
    ctx.fill();
    ctx.fillStyle = C(0, 0, 100, 0.14);
    rr(W - 20 - w - 18, 14, w + 36, 22, 16);
    ctx.fill();

    text(s, W - 20, 52, 42, 300, 95, 62, "right", 800);

    ctx.fillStyle = C(48, 100, 62, 0.3);
    rr(20, 16, 116, 46, 16);
    ctx.fill();
    text("HI", 32, 38, 14, 262, 80, 96, "left");
    text(String(Math.max(G.hi, G.score)).padStart(5, "0"), 32, 60, 21, 48, 100, 68, "left", 800);
  }

  function panel(x, y, w, h, hue) {
    ctx.save();
    rr(x, y, w, h, 20);
    ctx.shadowColor = C(262, 70, 15, 0.45);
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;
    ctx.fillStyle = C(hue, 88, 58);
    ctx.fill();
    ctx.restore();
    rr(x, y, w, h, 20);
    fillStroke(C(hue, 88, 58), C(hue, 70, 34), 4);
    ctx.fillStyle = C(hue, 90, 96, 0.16);
    rr(x + 5, y + 5, w - 10, h * 0.42, 16);
    ctx.fill();
  }

  function drawOverlay() {
    const blink = Math.sin(G.t * 5) > -0.2;

    if (!G.started) {
      ctx.fillStyle = C(262, 70, 15, 0.22);
      ctx.fillRect(0, 0, W, H);
      const w = 520, h = 150, x = (W - w) / 2, y = 62;
      panel(x, y, w, h, 285);
      text("RAINBOW DINO RUN", W / 2, y + 62, 38, 200, 95, 68, "center", 800);
      text("jump the cacti  •  duck the pterodactyls", W / 2, y + 94, 17, 300, 85, 96, "center");
      if (blink) text("PRESS SPACE  ·  TAP  ·  CLICK", W / 2, y + 128, 19, 48, 100, 72, "center", 800);
      return;
    }

    if (G.paused && !G.over) {
      ctx.fillStyle = C(262, 70, 15, 0.35);
      ctx.fillRect(0, 0, W, H);
      const w = 300, h = 96, x = (W - w) / 2, y = 88;
      panel(x, y, w, h, 200);
      text("PAUSED", W / 2, y + 58, 34, 200, 95, 70, "center", 800);
      text("press P to resume", W / 2, y + 80, 15, 300, 80, 96, "center");
      return;
    }

    if (G.over) {
      ctx.fillStyle = C(340, 70, 14, 0.28);
      ctx.fillRect(0, 0, W, H);
      const w = 430, h = 186, x = (W - w) / 2, y = 42;
      panel(x, y, w, h, 350);
      text("GAME OVER", W / 2, y + 58, 40, 350, 95, 70, "center", 800);
      text("SCORE", W / 2 - 70, y + 100, 14, 300, 80, 96, "center");
      text(String(G.score).padStart(5, "0"), W / 2 - 70, y + 132, 30, 48, 100, 66, "center", 800);
      text("BEST", W / 2 + 78, y + 100, 14, 300, 80, 96, "center");
      text(String(G.hi).padStart(5, "0"), W / 2 + 78, y + 132, 30, 160, 90, 72, "center", 800);
      if (blink) text("PRESS R  ·  SPACE  ·  TAP TO RUN AGAIN", W / 2, y + 168, 17, 0, 0, 100, "center", 800);
    }
  }

  function render() {
    ctx.save();
    if (G.shake > 0) {
      ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
    }
    drawSky();
    drawClouds();
    drawHills();
    drawGround();
    for (const o of obstacles) o.type === "bird" ? drawBird(o) : drawCactus(o);
    drawDino();
    drawParticles();
    ctx.restore();

    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
      text(p.text, p.x, p.y, 26, p.hue, 95, 72, "center", 800);
    }
    ctx.globalAlpha = 1;

    drawHUD();
    drawOverlay();

    if (G.flash > 0) {
      ctx.fillStyle = `hsla(0,100%,80%,${G.flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.25, (now - last) / 1000);
    last = now;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 6) {
      update();
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  cvs.addEventListener("pointerdown", () => {
    if (G.over) reset();
    else if (G.paused) G.paused = false;
  });
})();
</script>
</body>
</html>
